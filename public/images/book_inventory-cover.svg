<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><title>Bookstore / REST API</title><desc>Real endpoint mappings from BookController.java; a reference graphic, not an API execution trace.</desc><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><rect x="0" y="0" width="800" height="500" rx="0" fill="#15141d" stroke="none"/><circle cx="35" cy="35" r="4" fill="#bfa5ed" stroke="#bfa5ed" stroke-width="3"/><text x="53" y="41" fill="#a6a0b6" font-size="15" letter-spacing="2">BOOKSTORE / REST API</text><path d="M28 62L772 62" fill="none" stroke="#393544" stroke-width="2"/><text x="48" y="119" fill="#eeeaf5" font-size="32" >/api/books</text><rect x="40" y="151" width="720" height="48" rx="8" fill="#201e2b" stroke="none"/><text x="58" y="182" fill="#94bfae" font-size="19" >GET</text><text x="190" y="182" fill="#a6a0b6" font-size="20" >/api/books</text><rect x="40" y="210" width="720" height="48" rx="8" fill="#201e2b" stroke="none"/><text x="58" y="241" fill="#bfa5ed" font-size="19" >POST</text><text x="190" y="241" fill="#a6a0b6" font-size="20" >/api/books</text><rect x="40" y="269" width="720" height="48" rx="8" fill="#201e2b" stroke="none"/><text x="58" y="300" fill="#94bfae" font-size="19" >GET</text><text x="190" y="300" fill="#a6a0b6" font-size="20" >/api/books/{id}</text><rect x="40" y="328" width="720" height="48" rx="8" fill="#201e2b" stroke="none"/><text x="58" y="359" fill="#cfbc8a" font-size="19" >PUT</text><text x="190" y="359" fill="#a6a0b6" font-size="20" >/api/books/{id}</text><rect x="40" y="387" width="720" height="48" rx="8" fill="#201e2b" stroke="none"/><text x="58" y="418" fill="#c78d99" font-size="19" >DELETE</text><text x="190" y="418" fill="#a6a0b6" font-size="20" >/api/books/{id}</text></g></svg>