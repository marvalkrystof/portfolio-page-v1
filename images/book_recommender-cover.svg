<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><title>Books / semantic recommendations</title><desc>Simplified embedding, search, reranking pipeline. Bars illustrate ranked results, not measured scores.</desc><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><rect x="0" y="0" width="800" height="500" rx="0" fill="#15141d" stroke="none"/><circle cx="35" cy="35" r="4" fill="#bfa5ed" stroke="#bfa5ed" stroke-width="3"/><text x="53" y="41" fill="#a6a0b6" font-size="15" letter-spacing="2">BOOKS / SEMANTIC RECOMMENDATIONS</text><path d="M28 62L772 62" fill="none" stroke="#393544" stroke-width="2"/><rect x="45" y="103" width="710" height="63" rx="8" fill="#201e2b" stroke="none"/><text x="68" y="143" fill="#eeeaf5" font-size="24" >Describe your next read…</text><rect x="45" y="217" width="216" height="70" rx="7" fill="#201e2b" stroke="#393544"/><text x="153" y="260" fill="#bfa5ed" font-size="20" text-anchor="middle">EMBED</text><path d="M262 252L285 252" fill="none" stroke="#a6a0b6" stroke-width="2"/><rect x="292" y="217" width="216" height="70" rx="7" fill="#201e2b" stroke="#393544"/><text x="400" y="260" fill="#bfa5ed" font-size="20" text-anchor="middle">SEARCH</text><path d="M509 252L532 252" fill="none" stroke="#a6a0b6" stroke-width="2"/><rect x="539" y="217" width="216" height="70" rx="7" fill="#201e2b" stroke="#393544"/><text x="647" y="260" fill="#bfa5ed" font-size="20" text-anchor="middle">RERANK</text><text x="48" y="353" fill="#a6a0b6" font-size="18" >01</text><rect x="105" y="333" width="604" height="25" rx="3" fill="#9e8bbb" stroke="none"/><text x="48" y="396" fill="#a6a0b6" font-size="18" >02</text><rect x="105" y="376" width="478" height="25" rx="3" fill="#726584" stroke="none"/><text x="48" y="439" fill="#a6a0b6" font-size="18" >03</text><rect x="105" y="419" width="361" height="25" rx="3" fill="#51485e" stroke="none"/></g></svg>