<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>Algoshift / personal feed agent</title>
  <desc>Algoshift logo beside the four reel classifications: more of, feeds, doses, and drains.</desc>
  <rect width="800" height="500" fill="#15141d"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <circle cx="35" cy="35" r="4" fill="#bfa5ed"/>
    <text x="53" y="41" fill="#a6a0b6" font-size="15" letter-spacing="2">ALGOSHIFT / PERSONAL FEED AGENT</text>
    <path d="M28 62H772" stroke="#393544" stroke-width="2"/>

    <g transform="translate(105 142) scale(8.5)">
      <rect width="26" height="26" rx="7" fill="#f3f6f5"/>
      <circle cx="13" cy="13" r="9" fill="none" stroke="#dde5e2" stroke-width="2"/>
      <path d="M13 4a9 9 0 0 1 8.6 6.3" fill="none" stroke="#b4477d" stroke-width="2" stroke-linecap="round"/>
      <path d="M21.9 12.4A9 9 0 0 1 6.8 19.5" fill="none" stroke="#12917a" stroke-width="2" stroke-linecap="round"/>
      <circle cx="13" cy="13" r="3" fill="#12917a"/>
    </g>
    <text x="215" y="408" fill="#eeeaf5" font-size="25" text-anchor="middle" letter-spacing="3">ALGOSHIFT</text>

    <path d="M390 110V410" stroke="#393544" stroke-width="2"/>
    <text x="440" y="125" fill="#a6a0b6" font-size="15" letter-spacing="1.5">CLASSIFY. ADJUST. LOG.</text>

    <rect x="440" y="155" width="290" height="49" rx="6" fill="#201e2b" stroke="#12917a" stroke-width="1.5"/>
    <circle cx="466" cy="179.5" r="5" fill="#45bda3"/>
    <text x="486" y="187" fill="#eeeaf5" font-size="20">MORE OF</text>
    <text x="704" y="186" fill="#78c9b7" font-size="18" text-anchor="end">↑</text>

    <rect x="440" y="219" width="290" height="49" rx="6" fill="#201e2b" stroke="#4b3f5d" stroke-width="1.5"/>
    <circle cx="466" cy="243.5" r="5" fill="#bfa5ed"/>
    <text x="486" y="251" fill="#eeeaf5" font-size="20">FEEDS</text>
    <text x="704" y="250" fill="#bfa5ed" font-size="18" text-anchor="end">+</text>

    <rect x="440" y="283" width="290" height="49" rx="6" fill="#201e2b" stroke="#4b3f5d" stroke-width="1.5"/>
    <circle cx="466" cy="307.5" r="5" fill="#c68cb6"/>
    <text x="486" y="315" fill="#eeeaf5" font-size="20">DOSES</text>
    <text x="704" y="314" fill="#c68cb6" font-size="18" text-anchor="end">~</text>

    <rect x="440" y="347" width="290" height="49" rx="6" fill="#201e2b" stroke="#4b3f5d" stroke-width="1.5"/>
    <circle cx="466" cy="371.5" r="5" fill="#b4477d"/>
    <text x="486" y="379" fill="#eeeaf5" font-size="20">DRAINS</text>
    <text x="704" y="378" fill="#cf75a4" font-size="18" text-anchor="end">↓</text>

    <text x="440" y="438" fill="#a6a0b6" font-size="14">YOUR PROFILE → YOUR FEED</text>
  </g>
</svg>
